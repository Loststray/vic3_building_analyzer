 concept_cloudsilver_additives_desc: "早期的[GetGoods('blubber').GetName]燃料黏稠且杂质多。这会导致燃油管路燃烧不均匀且流量不稳定，发动机会发出一种金属敲击声。\n\n在鲸脂混合物中加入少量[GetGoods('cloudsilver').GetName]，可以得到更好的燃料混合物，使其流动更均匀，燃烧效率更高。这些方法最终由流亡的[GetCulture('vozi').GetName]奇械师基拉斯·泽菲林完善。"
